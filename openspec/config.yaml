# openspec/config.yaml
# SDD configuration for the trading-journal project.
# Generated by sdd-init. Keep this file as the source of truth for SDD context.

schema: spec-driven
artifact_store: hybrid

context: |
  Project: trading-journal (static trading journal web app).
  Tech stack: Vanilla HTML/CSS/JavaScript (ES5-style IIFE globals), no framework,
  no bundler, no build step, runs from file:// and GitHub Pages.
  Architecture: Static multi-file app. Global singletons Store (persistence,
  calculations, KPIs, import/export), DashboardCharts (Chart.js wrappers), and
  reference data in instruments.js; app.js is the DOM/UI controller.
  Persistence: Browser localStorage under key "bpt.journal.v1"; no backend,
  no network calls, data is per-device/per-browser.
  Charts: Chart.js 4.4.4 vendored locally at vendor/chart.umd.js.
  Testing: none detected (no package.json, no test runner, no linter, no CI).
  Language: code comments and identifiers in English; UI copy and README in Spanish.

# Strict TDD fails closed to false: no project marker was discovered and there is
# no workspace-level test command covering the in-scope project.
strict_tdd: false

# Testing capabilities (persisted separately here per the SDD contract).
testing:
  strict_tdd: false
  detected: "2026-09-11"
  runner: none
  workspace_command: null
  reason: >-
    No project marker (package.json, go.mod, pyproject.toml, Cargo.toml) was
    discovered and no workspace-level test command exists, so Strict TDD fails
    closed to false. No test runner, linter, type checker, formatter, coverage
    tool, or CI is configured.
  projects:
    - path: "."
      stack: "Vanilla HTML/CSS/JS static app (no build step)"
      test_command: null
      framework: null
      coverage_command: null
      linter_command: null
      type_checker_command: null
      formatter_command: null
      layers:
        unit: false
        integration: false
        e2e: false

# One entry per discovered project root. This project has no project marker, so
# the workspace root is the only entry and carries no runnable test command.
projects:
  - path: "."
    stack: "Vanilla HTML/CSS/JS static app (no build step)"
    test_command: null
    framework: null

rules:
  proposal:
    - Include rollback plan for risky changes
    - State the impact on the localStorage schema "bpt.journal.v1" when persisted data changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
    - Preserve the no-build constraint; file:// support is intentionally dropped for the Firebase migration
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns (IIFE globals, ES5-compatible syntax, no ES modules)
      - Keep code comments in English and UI copy in Spanish to match the project
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
